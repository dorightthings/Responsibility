# Actual server runtime checked on 2026-09-07.
# The old published template said CUDA 11.8; installed PyTorch uses CUDA 12.1.
name: responsibility-server-legacy
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8.20
  - pip
  - pytorch=2.1.2
  - pytorch-cuda=12.1
  - numpy=1.23.5
  - pandas=1.5.3
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - pyyaml=6.0.2
  - pip:
      - pyqlib==0.9.7
      - mlflow==2.17.2
      - cvxpy==1.5.2
