[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsibility-model"
version = "0.3.0"
description = "Consensus responsibility-guided evidence selection and transmission for stock prediction"
readme = "README.md"
requires-python = ">=3.8,<3.9"
license = {file = "LICENSE"}
authors = [
  {name = "dorightthings"},
]
keywords = [
  "stock-prediction",
  "quantitative-finance",
  "responsibility-routing",
  "pytorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.8",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==1.23.5",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "scikit-learn==1.3.2",
  "PyYAML==6.0.2",
  "pyqlib==0.9.7",
  "torch==2.1.2",
]

[project.urls]
Homepage = "https://github.com/dorightthings/Responsibility"
Repository = "https://github.com/dorightthings/Responsibility"
Issues = "https://github.com/dorightthings/Responsibility/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
